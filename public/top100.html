<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FPR Top 100</title>
<meta name="description" content="The top 100 NBA players by current Floor Performance Rating">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Barlow+Condensed:ital,wght@0,700;0,800;1,700;1,800&display=swap" rel="stylesheet">
<style>
:root{--navy:#173657;--blue:#6896bd;--bg:#0a1626;--gold:#e7c160;--silver:#c9d2dc;--bronze:#d08a52;--gap:14px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:#fff;-webkit-font-smoothing:antialiased}

header{padding:22px 20px 18px;position:relative;overflow:hidden}
header::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-55deg,rgba(255,255,255,.03) 0 22px,transparent 22px 44px)}
.hin{max-width:1180px;margin:0 auto;position:relative;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.logo{height:20px;display:block;margin-bottom:14px}
h1{font-family:'Barlow Condensed',sans-serif;font-style:italic;font-weight:800;font-size:56px;line-height:.9;text-transform:uppercase;letter-spacing:-.5px}
h1 span{color:var(--blue)}
.sub{font-size:13px;opacity:.75;margin-top:8px}
.sub b{font-weight:700}
.full{color:#fff;opacity:.85;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;text-decoration:none}

main{max-width:1180px;margin:0 auto;padding:16px 16px 60px}
.label{display:flex;align-items:center;gap:12px;margin:44px 0 16px;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-style:italic;text-transform:uppercase;letter-spacing:.08em;font-size:15px;color:var(--blue)}
.label::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(104,150,189,.5),transparent)}

/* ---- card ---- */
.card{aspect-ratio:3/4.1;position:relative;overflow:hidden;container-type:inline-size;
  background:radial-gradient(120% 75% at 50% 30%,var(--c) 0%,var(--cd) 55%,#0d1a2a 100%);border-top:3px solid var(--c);border-radius:4px}
.in{position:absolute;inset:0;display:flex;flex-direction:column;font-size:7.6cqw}
.ph{position:relative;flex:1;overflow:hidden}
.ph img,.ph .ini{position:absolute;left:50%;bottom:0;transform:translateX(-50%);height:100%;width:auto;max-width:none}
.ph .ini{width:100%;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:3em;color:rgba(255,255,255,.45)}
.rk{position:absolute;z-index:2;top:.35em;left:.45em;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-style:italic;font-size:2.3em;line-height:1;color:rgba(255,255,255,.92)}
.pl{position:relative;z-index:2;padding:1.6em .6em .55em;margin-top:-2.2em;background:linear-gradient(180deg,rgba(10,22,38,0),rgba(10,22,38,.92) 30%)}
.fn{font-size:.78em;font-weight:600;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:rgba(255,255,255,.75)}
.ln{font-family:'Barlow Condensed',sans-serif;font-weight:800;text-transform:uppercase;font-size:1.35em;line-height:1;white-space:nowrap;letter-spacing:.01em}
.meta{display:flex;align-items:baseline;justify-content:space-between;margin-top:.35em;gap:.4em}
.tm{font-size:.7em;font-weight:700;letter-spacing:.06em;color:rgba(255,255,255,.6)}
.elo{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1.45em;line-height:1;color:#9cc3e6}

/* ---- rows ---- */
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:var(--gap)}
.row .card{width:calc((100% - (var(--cols) - 1) * var(--gap)) / var(--cols))}
.r10{--cols:4}
.r25{--cols:5}
.r100{--cols:8;--gap:10px}

/* ---- podium ---- */
.podium{display:flex;justify-content:center;align-items:flex-end;gap:18px;padding-top:12px}
.pod{display:flex;flex-direction:column;width:300px}
.pod.p1{width:350px}
.pod .card{width:100%;border-top-color:var(--m)}
.pod .rk,.pod .elo{color:var(--m)}
.p1{--m:var(--gold)}.p2{--m:var(--silver)}.p3{--m:var(--bronze)}
.p1 .card{box-shadow:0 0 0 1px rgba(231,193,96,.55),0 0 3.5em rgba(231,193,96,.22)}
.step{margin-top:10px;border-top:3px solid var(--m);background:linear-gradient(180deg,#24405f,#132539);border-radius:2px;
  display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-style:italic;text-transform:uppercase;letter-spacing:.1em;color:var(--m);font-size:15px;box-shadow:0 10px 24px rgba(0,0,0,.45)}
.p1 .step{height:96px;font-size:18px}
.p2 .step{height:62px}
.p3 .step{height:38px}

@media (max-width:1000px){
  .r100{--cols:6}
  .pod{width:30%}.pod.p1{width:36%}
}
@media (max-width:640px){
  h1{font-size:44px}
  main{padding:8px 12px 60px}
  :root{--gap:8px}
  .label{margin:32px 0 12px;font-size:13px}
  .podium{flex-wrap:wrap;gap:22px 10px}
  .pod{width:calc(50% - 5px)}
  .pod.p1{order:-1;width:68%;margin:0 16%}
  .p1 .step{height:34px;font-size:14px}.p2 .step{height:34px;font-size:12px}.p3 .step{height:20px;font-size:11px}
  .r10{--cols:2}
  .r25{--cols:3}
  .r100{--cols:4;--gap:6px}
}
footer{max-width:1180px;margin:0 auto;padding:0 16px 40px;font-size:12px;line-height:1.6;color:rgba(255,255,255,.45)}
.err{padding:60px 0;text-align:center;color:rgba(255,255,255,.7)}
</style>
</head>
<body>
<header>
  <div class="hin">
    <div>
      <img class="logo" src="/fansided-logo.webp" alt="FanSided">
      <h1>FPR <span>Top 100</span></h1>
      <div class="sub" id="sub"></div>
    </div>
    <a class="full" href="/">Full FPR rankings →</a>
  </div>
</header>
<main id="main"></main>
<footer>FPR (Floor Performance Rating) is an era-adjusted, margin-weighted Elo rating built from every game since 1946. Ranking includes FPR-eligible players only. Headshots and current teams via ESPN rosters.</footer>
<script>
const TEAM = {
  ATL:'#C8102E',BOS:'#007A33',BKN:'#2b2b2b',CHO:'#1D1160',CHI:'#CE1141',CLE:'#860038',DAL:'#00538C',DEN:'#0E2240',DET:'#C8102E',GSW:'#1D428A',
  HOU:'#CE1141',IND:'#002D62',LAC:'#1D428A',LAL:'#552583',MEM:'#5D76A9',MIA:'#98002E',MIL:'#00471B',MIN:'#0C2340',NOP:'#0C2340',NYK:'#006BB6',
  OKC:'#007AC1',ORL:'#0077C0',PHI:'#006BB6',PHO:'#1D1160',POR:'#C8102E',SAC:'#5A2D81',SAS:'#4a4f54',TOR:'#CE1141',UTA:'#002B5C',WAS:'#002B5C'};
const shade=(h,f)=>{const n=parseInt(h.slice(1),16);return `rgb(${[n>>16,(n>>8)&255,n&255].map(v=>Math.round(v*f)).join(',')})`};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const initials=n=>n.split(' ').filter(Boolean).map(w=>w[0]).slice(0,2).join('').toUpperCase();
const split=n=>{const i=n.indexOf(' ');return i<0?['',n]:[n.slice(0,i),n.slice(i+1)]};
const NBA_IDS={'kevin porter':1629645}; // ESPN has no usable headshot for these
const nbaImg=id=>`https://cdn.nba.com/headshots/nba/latest/1040x760/${id}.png`;
const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[.'’]/g,'').replace(/\b(jr|sr|ii|iii|iv)\b/g,'').replace(/[^a-z ]/g,' ').replace(/\s+/g,' ').trim();

function card(p){
  const c=TEAM[p.team]||'#173657',[f,l]=split(p.name);
  const ph=p.headshot?`<img src="${esc(p.headshot)}" alt="${esc(p.name)}"${p.rank>25?' loading="lazy"':''} data-ini="${initials(p.name)}"${p.alt?` data-alt="${esc(p.alt)}"`:''} onerror="fail(this)">`:`<div class="ini">${initials(p.name)}</div>`;
  return `<div class="card" style="--c:${c};--cd:${shade(c,.5)}"><div class="in">
    <div class="rk">${p.rank}</div><div class="ph">${ph}</div>
    <div class="pl"><div class="fn">${esc(f)}</div><div class="ln">${esc(l)}</div>
    <div class="meta"><span class="tm">${esc(p.team)}</span><span class="elo">${Math.round(p.elo)}</span></div></div></div></div>`;
}
function fail(img){if(img.dataset.alt){const a=img.dataset.alt;delete img.dataset.alt;img.src=a;return}
  const d=document.createElement("div");d.className="ini";d.textContent=img.dataset.ini;img.replaceWith(d)}
function fit(){document.querySelectorAll('.ln').forEach(el=>{el.style.fontSize='';let s=1.35;
  while(el.scrollWidth>el.clientWidth&&s>.7){s-=.05;el.style.fontSize=s+'em'}})}
function render(d,P){
  document.getElementById('sub').innerHTML=`Through games of <b>${new Date(d.generated+'T12:00:00').toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})}</b> · ${d.eligible} eligible players`;
  const pod=(i,cls,word)=>`<div class="pod ${cls}">${card(P[i])}<div class="step">${word}</div></div>`;
  document.getElementById('main').innerHTML=`
    <div class="podium">${pod(1,'p2','2nd')}${pod(0,'p1','1st')}${pod(2,'p3','3rd')}</div>
    <div class="label">Top 10</div><div class="row r10">${P.slice(3,10).map(card).join('')}</div>
    <div class="label">11–25</div><div class="row r25">${P.slice(10,25).map(card).join('')}</div>
    <div class="label">26–100</div><div class="row r100">${P.slice(25,100).map(card).join('')}</div>`;
  document.fonts.ready.then(fit);
}
async function init(){
  let d;
  try{d=await (await fetch('/data/top100.json',{cache:'no-cache'})).json()}
  catch(e){document.getElementById('main').innerHTML='<div class="err">Could not load rankings.</div>';return}
  const P=d.players;
  render(d,P);
  try{const r=await fetch('/api/headshots');if(!r.ok)return;const h=await r.json();h.players=h.players||{};
    P.forEach(p=>{const k=norm(p.name),m=h.players[k],nba=NBA_IDS[k];
      if(m){p.headshot=m.headshot;p.alt=m.alt||null;if(TEAM[m.team])p.team=m.team}
      if(nba&&!(m&&m.headshot&&m.headshot.includes('cdn.nba.com'))){p.alt=p.headshot||null;p.headshot=nbaImg(nba)}});
    render(d,P)}catch(e){}
}
addEventListener('resize',()=>{clearTimeout(window._ft);window._ft=setTimeout(fit,150)});
init();
</script>
</body>
</html>
