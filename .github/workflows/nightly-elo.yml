# Nightly sweep: makes the night's games official without a manual update.
# Pulls every final box score ESPN has that the data doesn't, rebuilds the ratings, validates them,
# uploads the files that changed to the data bucket (the site reads /data from it) and commits the
# new source rows. Runs that find nothing new end in seconds.
#
# Needs repo secrets R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY and repo variables
# R2_BUCKET and DATA_URL (Settings → Secrets and variables → Actions).
name: Nightly Elo update

on:
  schedule:
    # GitHub queues scheduled runs on the hour and half hour for hours, so these sit on odd minutes.
    # Matchups and lineups grade from ESPN box scores without this run; it makes the day's cards and ratings.
    - cron: '7 5 * * *'     # ~1 a.m. ET: most nights' games are final
    - cron: '13 7 * * *'    # ~3 a.m. ET: late West Coast finishes
    - cron: '41 9 * * *'    # ~5:40 a.m. ET: ESPN stat corrections
    - cron: '23 12 * * *'   # ~8:20 a.m. ET: catch-up if an earlier run was late or failed
  workflow_dispatch:
    inputs:
      since:
        description: 'First day to check (YYYY-MM-DD). Leave blank for the latest day in the data.'
        required: false

permissions:
  contents: write

concurrency:
  group: nightly-elo
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      DATA_URL: ${{ vars.DATA_URL }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: pip install pandas==3.0.3 boto3   # same pandas as the local build, so outputs match

      - name: Check source data is in the repo
        run: |
          for f in data/bbref-pre1974.csv data/bbref-aba.csv data/charlotte.csv; do
            [ -f "$f" ] || { echo "::error::$f is missing from the repo; the build would not match a local build"; exit 1; }
          done

      - name: Pull the live ratings
        # fetch_espn.py matches ESPN names against the current ratings
        run: python3 scripts/sync_data.py pull elo.json

      - name: Fetch final ESPN box scores
        id: fetch
        run: python3 scripts/fetch_espn.py --github-output "$GITHUB_OUTPUT" ${{ inputs.since && format('--since {0}', inputs.since) || '' }}

      - name: Rebuild ratings
        if: steps.fetch.outputs.new_games != '0'
        run: |
          set -o pipefail
          python3 scripts/build_elo.py $(ls data/[0-9]*.csv | grep -v playoffs | sort) 2>&1 | tail -20
          python3 scripts/validate_output.py
          python3 scripts/split_elo.py
          python3 scripts/build_top100.py
          python3 scripts/build_timemachine.py
          python3 scripts/build_draft.py
          python3 scripts/build_binders.py
          python3 scripts/build_scoring.py

      - name: Upload changed data
        if: steps.fetch.outputs.new_games != '0'
        # Refuses a build with fewer seasons or games than the live data
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: python3 scripts/sync_data.py push

      - name: Commit and push
        if: steps.fetch.outputs.new_games != '0'
        run: |
          git config user.name "fpr-nightly"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/espn_updates.csv
          git commit -m "data: ${{ steps.fetch.outputs.new_games }} games through ${{ steps.fetch.outputs.through }} (ESPN nightly)"
          git reset --hard HEAD   # drop anything the build touched outside the commit
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 10
          done
          exit 1

      - name: Summary
        if: always()
        run: |
          echo "### Nightly Elo update" >> "$GITHUB_STEP_SUMMARY"
          echo "- New final games: ${{ steps.fetch.outputs.new_games || 'n/a' }} (through ${{ steps.fetch.outputs.through || 'n/a' }})" >> "$GITHUB_STEP_SUMMARY"
          echo "- Not final yet: ${{ steps.fetch.outputs.pending || 'n/a' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Players with no ratings match (rated as new): ${{ steps.fetch.outputs.unmatched || 'n/a' }}" >> "$GITHUB_STEP_SUMMARY"
